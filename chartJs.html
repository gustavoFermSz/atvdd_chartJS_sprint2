<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style></style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">

    <title>Gráfico com Chart JS</title>


</head>

<body>

    <h2>Temperatura e umidade médias registradas na minha casa durante as tardes do primeiro semestre de 2023</h2>

    <div class="containerGraficos">


        <div>

            <canvas id="my2ndChart"></canvas>

        </div>

        <div>

            <canvas id="myChart"></canvas>

        </div>

    </div>

    
    <h2>Comparação quantitativa de indivíduos de 3 nacionalidades constantes no continente americano</h2>

    <div class="containerDesafio">

        <canvas id="my3rdChart"></canvas>

    </div>

</body>

</html>


<script>

    /* Gráfico de BARRAS */
    const ctx = document.getElementById('myChart');

    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho'],
            datasets: [{
                label: 'Temperatura em °C',
                data: [22, 24, 27, 23, 20, 18],
                borderWidth: 1,
                borderColor: '#FF6384',
                backgroundColor: '#FFB1C1'
            },
            {
                label: 'Umidade do ar',
                data: [90, 89, 93, 87, 88, 82],
                borderWidth: 1,
                borderColor: '#36A2EB',
                backgroundColor: '#9BD0F5'
            }]
        },
        options: {
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    });



    /* Gráfico de LINHAS */

    const cty = document.getElementById('my2ndChart');

    new Chart(cty, {
        type: 'line',
        data: {
            labels: ['12:00', '13:00', '14:00', '15:00', '16:00', '17:00'],
            datasets: [{
                label: 'Temperatura em °C',
                data: [30, 29, 28, 25, 22, 23],
                borderWidth: 1,
                borderColor: '#FF6384',
                backgroundColor: '#FFB1C1'
            },
            {
                label: 'Umidade do ar',
                data: [80, 82, 80, 85, 80, 83],
                borderWidth: 1,
                borderColor: '#36A2EB',
                backgroundColor: '#9BD0F5'
            }]
        },
        options: {
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    });





    /* Gráfico de DÔNUT */

    const ctz = document.getElementById('my3rdChart');

    new Chart(ctz, {
        type: 'doughnut',
        data: {
            labels: [
                'Canadenses',
                'Guianeses',
                'Equatorianos'
            ],
            datasets: [{
                label: 'População (milhões)',
                data: [65, 10, 20],
                backgroundColor: [
                    'red',
                    'blue',
                    'yellow'
                ],
                hoverOffset: 4
            }]
        }
    });

</script>
